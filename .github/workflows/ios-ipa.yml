name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA for AltStore
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      NODE_ENV: production
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/Baraka.xcworkspace \
            -scheme Baraka \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Release-iphoneos/Baraka.app artifacts/Payload/
          ditto -c -k --sequesterRsrc --keepParent artifacts/Payload artifacts/Baraka.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baraka-ios-${{ github.sha }}
          path: artifacts/Baraka.ipa
          if-no-files-found: error
          retention-days: 14